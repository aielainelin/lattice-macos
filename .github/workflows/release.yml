name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Lattice DMG
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build & Package DMG
        run: |
          chmod +x ./build.sh
          ./build.sh --dmg

      - name: Create Release and Upload DMG
        uses: softprops/action-gh-release@v2
        with:
          files: build/Lattice.dmg
          name: "Lattice ${{ github.ref_name }}"
          body: |
            ## Lattice ${{ github.ref_name }} 🪟
            
            優雅、極速、純原生 Swift 開發的 macOS 格線視窗管理工具。
            
            ### 📥 安裝方式 (Installation)
            1. 下載下方的 `Lattice.dmg`。
            2. 開啟 DMG 並將 `Lattice.app` 拖入 `Applications` 資料夾。
            3. 首次開啟請至「系統設定」>「隱私權與安全性」>「輔助使用」授權 Lattice。
            
            ### ✨ 核心功能
            - 🎯 **視覺化拖曳劃格 (Visual Grid HUD)**：按 `⌘⌥Space` 或 `⌃⌥Space` 呼叫
            - 🥇 **跨螢幕投遞 (Throw to Screen)**：`⌃⌥⌘→` / `⌃⌥⌘←`
            - 🥈 **連續快捷鍵循環 (Hotkey Cycling)**：連按 `⌘⇧←` / `⌘⇧→` 切換 1/2 ⇄ 2/3 ⇄ 1/3
            - 🥉 **HUD 數字鍵 1~9 快速槽**：呼叫 HUD 後直接敲數字鍵快速佈局
          generate_release_notes: true
          draft: false
          prerelease: false
